# ============================================================================
# 向量化文本模型（Embedding）配置
#
# 用法：
#   with Path("./InfoGen_Data/Config/Embedding.toml").open("rb") as ConfigFile:
#       Config = tomllib.load(ConfigFile)
#   Embeddings = OpenAIEmbeddings(**Config)
#
# 本文件的顶层键会被原样展开为 OpenAIEmbeddings 的构造参数（kwargs），所以键名必须
# 与该类的字段名或其别名一致（例如 base_url = openai_api_base、api_key =
# openai_api_key、timeout = request_timeout）。该类只允许已知字段，未识别的键会被
# 自动塞进 model_kwargs 并打印警告，因此扩展参数请统一写在 [model_kwargs] 表里。
# ============================================================================

# ------------------------------- 模型参数 -----------------------------------
# 模型名。使用第三方 OpenAI 兼容服务时改成对方提供的模型名
model = ""

# 输出向量维度，仅 text-embedding-3 及之后的模型支持；删除本行则使用模型默认维度
# dimensions = 1536

# ------------------------------- 服务端参数 ---------------------------------
# OpenAI 兼容服务的地址：官方 / vLLM / Ollama / OpenRouter 等
base_url = ""

# 密钥。留空字符串并删除本行可改用环境变量 OPENAI_API_KEY
api_key = ""

# 组织 ID，一般不需要
# organization = ""

# Azure OpenAI 等服务需要额外指定 API 版本
# api_version = "2024-02-01"

# --------------------------- 请求与批处理参数 -------------------------------
# 单次请求最多提交多少条文本
chunk_size = 1000

# 请求超时（秒），别名 timeout
timeout = 60.0

# 失败重试次数
max_retries = 2

# 单条文本超过该 token 数时自动切分
embedding_ctx_length = 8191

# 第三方服务通常不支持先分词再提交，此时取消下面两行的注释
check_embedding_ctx_length = false
# tiktoken_enabled = false

# 是否跳过空字符串（false 表示遇到空串直接报错）
# skip_empty = false

# ----------------------- 透传给底层 create 的额外参数 ------------------------
# [model_kwargs]
# # 以浮点数组而非 base64 返回向量，部分第三方服务不支持 base64
encoding_format = "float"
