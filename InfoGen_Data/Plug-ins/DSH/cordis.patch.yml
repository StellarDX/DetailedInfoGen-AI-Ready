# InfoGen-DSH bundle patch
#
# 1. infogen-dsh           — Host 守护插件：在用户启用本 Agent 后探测 MCP 服务，
#                            连续 3 次失败时向窗口顶部推送只读提示；同时暴露
#                            只读状态路由 /infogen-dsh/status 供 Web 端轮询。
# 2. preset-infogen-dsh    — Agent 预设：只有选择该预设的会话才会获得 InfoGen
#                            MCP 工具、全局提示词与只读工具集。
#
# 所有值都可以由 profile 的 cordis.patch.yml 按行 id 覆盖。

- insert:
    - id: infogen-dsh
      name: 'infogen-dsh'
      config:
        mcpUrl: http://localhost:8000/mcp
        presetId: infogen-dsh
        # 面向用户的失败提示阈值：连续探测失败 3 次后在窗口顶部提示一次。
        attempts: 3
        retryDelaysMs: [1000, 2000, 4000]
        probeTimeoutMs: 4000
        pollIntervalMs: 10000

    - id: preset-infogen-dsh
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: infogen-dsh
        name: InfoGen-DSH
        description: '加入了AI的SpaceEngine详细信息生成器，适配0.99x，可向下兼容0.980。'
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是 InfoGen-DSH，一个服务于 SpaceEngine 行星系统数据查询与扩展设定生成的只读助手。
                回答前优先调用 mcp__infogen__ 前缀的 InfoGen MCP 工具核对数据；只读取用户提供的设定文档，绝不修改任何文件、数据库或外部状态。
                MCP 工具不可用时，明确告知用户服务不可达，不要编造查询结果。

          # 读取用户设定文档（AGENTS.md / CLAUDE.md）属于只读操作。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # 只读文件工具：保留 read / read_image，关闭 write / edit / apply_patch。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: false
              edit: false
              applyPatch: false

          # 只读检索：glob / grep。
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

          - id: infogen-mcp
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: infogen
              transport: streamable-http
              url: http://localhost:8000/mcp
              # 启动失败只记录诊断，绝不阻断 DSH 启动或会话创建。
              failOnStartupError: false
              # Global.txt 会随 MCP initialize 的 instructions 下发，留足字节预算。
              maxInstructionBytes: 65536
              toolCallTimeoutMs: 60000
              startupTimeoutMs: 15000
              closeTimeoutMs: 5000
              reconnect:
                enabled: true
                initialDelayMs: 2000
                maxDelayMs: 30000
                # 面向用户的“连续 3 次失败”提示由 infogen-dsh 守护插件负责；
                # 这里保持后台重连，避免 InfoGen 稍后启动时工具永久不可用。
                maxAttempts: 10000
